<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE POINT DIVING CENTRE - 出船預訂系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-6">
        <!-- 英文店名與中文系統名 -->
        <div class="text-center mb-6">
            <span class="text-xs font-bold tracking-widest text-blue-600 uppercase">BLUE POINT DIVING CENTRE</span>
            <h2 class="text-2xl font-bold text-slate-800 mt-1">藍點潛水出船預訂系統</h2>
            <p class="text-xs text-slate-500">Boat Trip Booking & Equipment Rental System</p>
        </div>
        
        <!-- 預訂表單 -->
        <form id="bookingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">參加者姓名 / Participant Name</label>
                <input type="text" id="name" required placeholder="例如: Alex Chan (教練/學員)" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">選擇首選組別 (Preferred Group)</label>
                <select id="preferredGroup" class="mt-1 w-full p-2.5 border rounded-lg text-sm bg-white">
                    <option value="Group A">Group A (1-3號位)</option>
                    <option value="Group B1">Group B1 (4-8號位)</option>
                    <option value="Group B2">Group B2 (9-11號位)</option>
                    <option value="Group B3">Group B3 (12-14號位)</option>
                    <option value="Group C1">Group C1 (15-19號位)</option>
                    <option value="Group C2">Group C2 (20-22號位)</option>
                    <option value="Group C3">Group C3 (23-25號位)</option>
                </select>
                <p class="text-xs text-slate-400 mt-1">* 若首選組別已滿，系統將自動跳轉至同側相鄰空位。</p>
            </div>

            <!-- 裝備租借區 (連尺碼) -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">裝備租借與尺碼 / Equipment Rental & Sizing</label>
                <div class="space-y-2 border p-3 rounded-lg bg-slate-50 text-sm">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2"><input type="checkbox" id="needMask" class="rounded"><span>Mask 面鏡</span></label>
                        <input type="text" id="maskSize" placeholder="尺碼/Size" class="w-24 p-1 border text-xs rounded bg-white">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2"><input type="checkbox" id="needTopSuit" class="rounded"><span>Upper Suit 上身防寒衣</span></label>
                        <input type="text" id="topSuitSize" placeholder="例如: M" class="w-24 p-1 border text-xs rounded bg-white">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2"><input type="checkbox" id="needBottomSuit" class="rounded"><span>Lower Suit 下身防寒褲</span></label>
                        <input type="text" id="bottomSuitSize" placeholder="例如: M" class="w-24 p-1 border text-xs rounded bg-white">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2"><input type="checkbox" id="needBcd" class="rounded"><span>BCD 浮力調節背心</span></label>
                        <input type="text" id="bcdSize" placeholder="例如: L" class="w-24 p-1 border text-xs rounded bg-white">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2"><input type="checkbox" id="needReg" class="rounded"><span>Regulator 調節器</span></label>
                        <span class="text-xs text-slate-400 w-24 text-center">標準配置</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2"><input type="checkbox" id="needFins" class="rounded"><span>Fins 蛙鞋</span></label>
                        <input type="text" id="finsSize" placeholder="例如: 42-43" class="w-24 p-1 border text-xs rounded bg-white">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-md">
                確認預訂並獲取座位 / Submit & Get Seat
            </button>
        </form>

        <!-- 結果顯示區 -->
        <div id="result" class="mt-4 p-4 bg-green-50 border border-green-200 text-green-800 rounded-lg hidden"></div>

        <!-- 🗺️ 實時座位平面圖 (完全按照你提供的擺位結構) -->
        <div class="mt-8 pt-6 border-t border-slate-200">
            <h3 class="font-bold text-slate-700 text-sm mb-3 text-center">🗺️ 船上座位實時分佈圖 / Live Seat Map</h3>
            
            <!-- 船頭 -->
            <div class="text-center text-xs font-bold text-blue-600 mb-3 bg-blue-50 py-1.5 rounded-lg border border-blue-100">🛟 船頭 (Bow)</div>

            <!-- Group A (#1, #2, #3) -->
            <div id="rowA" class="grid grid-cols-3 gap-2 mb-4"></div>

            <!-- U型主體區塊 (6列網格對應你圖中的左右與底部環繞) -->
            <div id="boatBody" class="grid grid-cols-6 gap-1.5 text-center text-xs">
                <!-- 動態由 JS 填入 -->
            </div>

            <div class="flex justify-center items-center space-x-6 mt-4 text-xs text-slate-600">
                <span class="flex items-center"><span class="w-3 h-3 bg-green-50 border border-green-300 rounded-sm mr-1.5"></span> 可選 Available</span>
                <span class="flex items-center"><span class="w-3 h-3 bg-red-50 border border-red-200 rounded-sm mr-1.5"></span> 已佔用 Occupied</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & 智能邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDN890oKfEuBykjwmkB7LYZmWBaRRdE-Fk",
            authDomain: "dive-booking-app.firebaseapp.com",
            projectId: "dive-booking-app",
            storageBucket: "dive-booking-app.firebasestorage.app",
            messagingSenderId: "842369140474",
            appId: "1:842369140474:web:8652ee5b8e3cb8b9182b43",
            measurementId: "G-1KKFD435GD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 組別容量設定
        const groupCapacity = {
            "Group A": { max: 3, range: [1, 2, 3], next: "Group B1" },
            "Group B1": { max: 5, range: [4, 5, 6, 7, 8], next: "Group B2" },
            "Group B2": { max: 3, range: [9, 10, 11], next: "Group B3" },
            "Group B3": { max: 3, range: [12, 13, 14], next: "Group C1" },
            "Group C1": { max: 5, range: [15, 16, 17, 18, 19], next: "Group C2" },
            "Group C2": { max: 3, range: [20, 21, 22], next: "Group C3" },
            "Group C3": { max: 3, range: [23, 24, 25], next: null }
        };

        // 依照你提供的擺位圖設計的 6 列網格結構 (null 代表走廊空白位)
        const layoutGrid = [
            [25, null, 15, 14, null, 4],
            [24, null, 16, 13, null, 5],
            [23, null, 17, 12, null, 6],
            [22, null, 18, 11, null, 7],
            [21,   20, 19, 10,    9, 8]
        ];

        // 載入及渲染座位圖
        async function loadSeatMap() {
            try {
                const querySnapshot = await getDocs(collection(db, "blue_point_bookings"));
                const occupiedSeats = [];
                querySnapshot.forEach((doc) => {
                    occupiedSeats.push(doc.data().assignedSeatNum);
                });

                // 1. 渲染頂部 Group A (#1, #2, #3)
                const rowADiv = document.getElementById('rowA');
                rowADiv.innerHTML = '';
                for (let i = 1; i <= 3; i++) {
                    const isOccupied = occupiedSeats.includes(i);
                    const box = document.createElement('div');
                    box.className = `p-2.5 rounded-lg font-bold text-xs text-center shadow-sm ${isOccupied ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-700 border border-green-300'}`;
                    box.innerHTML = `#${String(i).padStart(2, '0')}<br><span class="text-[10px] font-normal">${isOccupied ? '已佔用' : '可選'}</span>`;
                    rowADiv.appendChild(box);
                }

                // 2. 渲染 U 型主體區塊 (#4 到 #25)
                const boatBodyDiv = document.getElementById('boatBody');
                boatBodyDiv.innerHTML = '';

                layoutGrid.forEach(row => {
                    row.forEach(seatNum => {
                        const cell = document.createElement('div');
                        if (seatNum === null) {
                            // 空白通道
                            cell.className = "p-2";
                        } else {
                            const isOccupied = occupiedSeats.includes(seatNum);
                            cell.className = `p-2 rounded-lg font-bold text-xs shadow-sm ${isOccupied ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-700 border border-green-300'}`;
                            cell.innerHTML = `#${String(seatNum).padStart(2, '0')}<br><span class="text-[10px] font-normal">${isOccupied ? '已佔用' : '可選'}</span>`;
                        }
                        boatBodyDiv.appendChild(cell);
                    });
                });

            } catch (error) {
                console.error("載入座位圖失敗:", error);
            }
        }

        loadSeatMap();

        // 提交表單邏輯
        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            let targetGroup = document.getElementById('preferredGroup').value;

            const equipment = {
                mask: document.getElementById('needMask').checked ? (document.getElementById('maskSize').value || 'Standard') : '自備 / Own',
                topSuit: document.getElementById('needTopSuit').checked ? (document.getElementById('topSuitSize').value || 'Standard') : '自備 / Own',
                bottomSuit: document.getElementById('needBottomSuit').checked ? (document.getElementById('needBottomSuit').value || 'Standard') : '自備 / Own',
                bcd: document.getElementById('needBcd').checked ? (document.getElementById('bcdSize').value || 'Standard') : '自備 / Own',
                regulator: document.getElementById('needReg').checked ? '需要 / Required' : '自備 / Own',
                fins: document.getElementById('needFins').checked ? (document.getElementById('finsSize').value || 'Standard') : '自備 / Own',
            };

            try {
                const querySnapshot = await getDocs(collection(db, "blue_point_bookings"));
                const groupCounts = {};
                const occupiedSeats = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    occupiedSeats.push(data.assignedSeatNum);
                    groupCounts[data.assignedGroup] = (groupCounts[data.assignedGroup] || 0) + 1;
                });

                let allocatedGroup = targetGroup;
                while (allocatedGroup && groupCounts[allocatedGroup] >= groupCapacity[allocatedGroup].max) {
                    allocatedGroup = groupCapacity[allocatedGroup].next;
                }

                if (!allocatedGroup) {
                    alert("很抱歉，本船目前所有組別已額滿！\nSorry, all groups on this boat are fully booked!");
                    return;
                }

                const currentGroupConfig = groupCapacity[allocatedGroup];
                let assignedSeatNum = null;
                for (let seat of currentGroupConfig.range) {
                    if (!occupiedSeats.includes(seat)) {
                        assignedSeatNum = seat;
                        break;
                    }
                }

                if (assignedSeatNum === null) {
                    alert("選擇的組別已無剩餘空位 / Selected group has no remaining seats.");
                    return;
                }

                const seatCode = `#${String(assignedSeatNum).padStart(2, '0')}`;

                await addDoc(collection(db, "blue_point_bookings"), {
                    name,
                    preferredGroup: targetGroup,
                    assignedGroup: allocatedGroup,
                    assignedSeatNum,
                    seatCode,
                    equipment,
                    createdAt: new Date()
                });

                loadSeatMap();

                const resultDiv = document.getElementById('result');
                resultDiv.classList.remove('hidden');
                
                let noticeHTML = (targetGroup !== allocatedGroup) 
                    ? `<p class="text-amber-600 text-xs mt-1">⚠️ 首選 ${targetGroup} 已滿，已自動跳轉至 ${allocatedGroup}。</p>` 
                    : '';

                resultDiv.innerHTML = `
                    <h3 class="font-bold text-base mb-1">✅ 預訂成功 / Booking Confirmed!</h3>
                    <hr class="my-1 border-green-200">
                    <p><strong>參加者 / Name:</strong> ${name}</p>
                    <p><strong>分配組別 / Group:</strong> ${allocatedGroup}</p>
                    <p><strong>獲取座位 / Seat Number:</strong> <span class="text-lg font-bold text-blue-700">${seatCode}</span></p>
                    ${noticeHTML}
                    <div class="mt-2 text-xs text-slate-600">
                        <strong>租借裝備 / Gear:</strong> 
                        Mask: ${equipment.mask} | Suit: ${equipment.topSuit}/${equipment.bottomSuit} | BCD: ${equipment.bcd} | Reg: ${equipment.regulator} | Fins: ${equipment.fins}
                    </div>
                `;

                document.getElementById('name').value = '';

            } catch (error) {
                console.error("Error adding document: ", error);
                alert("發生錯誤，請稍後再試 / Error: " + error.message);
            }
        });
    </script>
</body>
</html>
